name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend typecheck
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run typecheck
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
