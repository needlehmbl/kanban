services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-kanban}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kanban}
      POSTGRES_DB: ${DB_NAME:-kanban}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kanban}:${DB_PASSWORD:-kanban}@postgres:5432/${DB_NAME:-kanban}
      PORT: 4000
      FRONTEND_URL: http://localhost:5176
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:4000/auth/github/callback}
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy || npx prisma db push; npm run dev"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5176:5176"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
